# dot-RegimeSwitch-v1 version 1.1.0: the regime-switching suite with mechanisms
# that read their parents and with arms that share their noise.
#
# In version 1.0.0 a renaming step left every regime-switching mechanism without
# parents, so each variable of the released suite is independent noise and no
# intervention reaches another variable. Its two arms are also independent
# draws. This version repairs the mechanisms and pairs the arms. Graphs, noise
# models, interventions and episode seeds are those of version 1.0.0, except in
# the few episodes that are resampled.
#
#   prior_config.regime_canonical_weights: true
#                              -> the mechanisms read their parents
#                                 (dotime.prior, since package 0.2.0)
#   prior_config.hardening     -> with live mechanisms the default prior is
#                                 unstable: 387 of 600 measured episodes diverge
#                                 without it and 1 of 600 with it
#                                 (results/reference/regime_weights/). The values
#                                 are dotime.hardening.RECOMMENDED_HARDENING
#   stability_retries: 10      -> an episode with a zeroed arm is resampled, so
#                                 the suite holds no diverged episode
#   amplitude_limit: 50        -> an episode with a value above 50 in either arm
#                                 is resampled as well. Each regime is
#                                 stabilised on its own, which does not bound a
#                                 system that switches between regimes. In a
#                                 build without the limit 8 of 9,999 episodes
#                                 exceed 50, up to 322.8, and the largest
#                                 target is 236.4, while 99.9% of the targets
#                                 stay below 11.8
#                                 (results/reference/regime_v1_1/amplitude_tail.json)
#   pair_mode: counterfactual  -> one noise realisation and one regime path per
#                                 episode are shared by both arms, so they agree
#                                 exactly before the onset and y_true - y_obs is
#                                 a per-episode counterfactual effect. With
#                                 independent arms no reference estimator beat
#                                 the pre-onset mean on a build of this recipe
#                                 (results/reference/regime_v1_1/independent_arms/)
#   query_row: window_end      -> the query sits at the last step of the
#                                 intervention window, not at T-1. The
#                                 stabilised dynamics are contractive. In a
#                                 pilot of 600 episodes the window closes a
#                                 median 30.5 steps before T-1, and 9.2% of
#                                 the counterfactual effects reach 0.1 in size
#                                 at T-1, against 77.8% at the window's end
#                                 (results/reference/regime_v1_1/design_pilot.json)
#   record_graph: true         -> metadata["graph"] holds the lagged graph of
#                                 every regime (dotime.graph_meta) and the
#                                 regime of every step, which both arms share
#
# The build goes through the regime_configured spec kind of dotime._build. The
# shared noise and the shared regime path come from the prior's counterfactual
# generator, which is seeded from the episode seed, so an episode does not
# depend on numpy's global generator or on the number of workers.
#
# The suite sets its own seed, the suite seed of version 1.0.0 (top-level seed
# + 2000), so it keeps that seed whether it is built alone or next to other
# suites.
seed: 20260719
T: 200

suites:

  dot-RegimeSwitch-v1:
    version: "1.1.0"
    generator: regime
    seed: 20262719
    T: 200
    # regime density -> tier; episodes split evenly across densities
    densities: {2: 1, 3: 2, 5: 3}
    n_episodes: 10000
    stability_retries: 10
    amplitude_limit: 50
    pair_mode: counterfactual
    prior_config:
      regime_canonical_weights: true
      hardening:
        unit_norm_rows: true
        spectral_rho: 0.9
        bounded_square: true
    query_row: window_end
    record_graph: true
